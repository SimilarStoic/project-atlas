[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-atlas"
version = "0.1.0"
description = "Foundation for the Project Atlas Python application."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Project Atlas Team" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
  "black==26.3.1",
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_atlas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["database/migrations", "work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["project_atlas"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "(database/migrations|work|outputs)"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
